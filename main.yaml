---
- name: Configure macOS
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - default.config.yaml

  pre_tasks:
    - name: Include machine-local overrides, if present
      ansible.builtin.include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.local.yaml"
      tags: ["always"]

  tasks:
# This is done in the bootstrap.sh.  Why do it twice
#    - name: Clone or update the dotfiles repo
#      ansible.builtin.import_tasks: tasks/repo.yml
#      tags: dotfiles

    - name: Install Homebrew packages and casks
      ansible.builtin.import_tasks: tasks/homebrew.yml

    - name: Symlink repo config/ directories into ~/.config
      ansible.builtin.import_tasks: tasks/config_symlinks.yml

    - name: Symlink custom home dotfiles
      ansible.builtin.import_tasks: tasks/home_symlinks.yml
