- name: Symlink repo config directories into ~/.config
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ repo_config_dirs.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags: symlink_config_dirs

- name: Symlink repo config files into ~/.config
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ repo_config_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags: symlink_config_files