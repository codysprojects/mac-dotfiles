---
# Every directory, or file under config/ in this repo gets symlinked into ~/.config
# under the same name. Add a new tool's config by dropping its directory in
# config/ and re-running the playbook.

- name: Discover config directories in repo
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/config"
    file_type: directory
  register: repo_config_dirs
  tags: ["always"]

- name: Discover config files in repo
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/config"
    file_type: file
  register: repo_config_files
  tags: ["always"]

- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config"
    state: directory
    mode: "0755"

