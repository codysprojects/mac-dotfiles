- name: Symlink repo home directories into ~/
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ repo_home_dirs.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags: symlink_home_dirs

- name: Symlink repo home files into ~/
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ repo_home_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags: symlink_home_files