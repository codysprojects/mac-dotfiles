---
# Every directory, or file under home/ in this repo gets symlinked into ~/
# under the same name.


- name: Discover home directories in repo
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/home"
    file_type: directory
  register: repo_home_dirs
  tags: ["always"]

- name: Discover home files in repo
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/home"
    file_type: file
    hidden: true
  register: repo_home_files
  tags: ["always"]


